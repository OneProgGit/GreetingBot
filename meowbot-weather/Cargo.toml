[package]
name = "meowbot-weather"
version = "0.7.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
meowbot-proto = { version = "0.7.0", path = "../meowbot-proto" }
prost = "0.14.1"
prost-types = "0.14.1"
reqwest = { version = "0.12.23", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["rt-multi-thread"] }
tonic = "0.14.2"

[lints]
workspace = true
