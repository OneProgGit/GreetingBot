[package]
name = "meowbot-db"
version = "0.7.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
meowbot-proto = { version = "0.7.0", path = "../meowbot-proto" }
prost = "0.14.3"
prost-types = "0.14.3"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
tonic = "0.14.2"

[lints]
workspace = true
