syntax = "proto3";

package db;

import "google/protobuf/empty.proto";
import "models.proto";

service Db {
  rpc CreateUser(models.User) returns (google.protobuf.Empty);
  rpc UpdateUser(models.User) returns (google.protobuf.Empty);
  rpc GetUser(GetUserMessage) returns (models.User);
  rpc GetUsers(google.protobuf.Empty) returns (models.UsersList);
}

message GetUserMessage {
  string id = 1;
}
