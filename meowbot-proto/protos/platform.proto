syntax = "proto3";

package platform;

import "google/protobuf/empty.proto";
import "models.proto";

service Platform {
  rpc SendMessage(NewMessage) returns (google.protobuf.Empty);
  rpc BindStartCommand(Command) returns (google.protobuf.Empty);
}

message NewMessage {
  models.User user = 1;
  string text = 2;
}

message Command { string text = 1; }
